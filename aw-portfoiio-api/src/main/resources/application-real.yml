spring:
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_batch_fetch_size: 30
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mysql://${DB_URL}:${DB_PORT}/PORTFOLIO
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  cache:
    cache-names: presigned
    caffeine:
      spec: expireAfterWrite=50m

  # 스테이시즌 입점 신청 알림 메일 (MAIL_HOST 가 비어 있으면 메일을 보내지 않음)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS:true}
          ssl:
            enable: ${MAIL_SSL:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

stayseason:
  mail:
    to: ${STAYSEASON_MAIL_TO:support@stay-season.com}
    from: ${STAYSEASON_MAIL_FROM:}

# 로컬 파일 저장소 설정 (운영)
file:
  storage:
    location: ${FILE_STORAGE_LOCATION:/home/awdesign/uploads}
    base-url: ${FILE_STORAGE_BASE_URL:https://alwaysdesign-portfolio.com/files}

logging:
  file:
    name: /home/awdesign/logs/spring.log
    level:
      root: INFO
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.log

cookie:
  secure: true

cors:
  url: https://alwaysdesign-portfolio.com

server:
  address: 127.0.0.1
