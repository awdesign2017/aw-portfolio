name: Deploy FE + BE

# ============================================================================
#  배포 트리거 두 가지:
#  1) 수동 — Actions 탭 → "Run workflow" → backend / frontend / both 선택
#  2) 자동 — main 브랜치 push 시, 변경된 디렉토리만 자동 배포
#           (aw-portfoiio-api → backend, aw-portfoiio-front → frontend)
#
#  필요 Secrets (Settings → Secrets and variables → Actions):
#    SSH_HOST          = 1.226.82.152
#    SSH_USER          = awdesign
#    SSH_PRIVATE_KEY   = stay-season-fetcher 접속용 SSH 개인 키 (전체 PEM)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'both'
        type: choice
        options:
          - backend
          - frontend
          - both
  push:
    branches: [main]
    paths:
      - 'aw-portfoiio-api/**'
      - 'aw-portfoiio-front/**'
      - 'deploy/deploy-backend.sh'
      - 'deploy/deploy-frontend.sh'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run_backend:  ${{ steps.decide.outputs.run_backend }}
      run_frontend: ${{ steps.decide.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'aw-portfoiio-api/**'
              - 'deploy/deploy-backend.sh'
            frontend:
              - 'aw-portfoiio-front/**'
              - 'deploy/deploy-frontend.sh'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ inputs.target }}"
            [ "$T" = "backend"  ] || [ "$T" = "both" ] && echo "run_backend=true"  >> $GITHUB_OUTPUT || echo "run_backend=false" >> $GITHUB_OUTPUT
            [ "$T" = "frontend" ] || [ "$T" = "both" ] && echo "run_frontend=true" >> $GITHUB_OUTPUT || echo "run_frontend=false" >> $GITHUB_OUTPUT
          else
            echo "run_backend=${{ steps.changes.outputs.backend }}"   >> $GITHUB_OUTPUT
            echo "run_frontend=${{ steps.changes.outputs.frontend }}" >> $GITHUB_OUTPUT
          fi

  deploy-backend:
    needs: detect
    if: needs.detect.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH → 백엔드 재배포
        uses: appleboy/ssh-action@v1.0.3
        # 입점 신청 알림 메일 계정 (선택). Secrets 에 MAIL_USERNAME / MAIL_PASSWORD 가 있으면
        # 서버의 /home/awdesign/aw-portfolio-mail.properties 로 써 넣는다 (application-real.yml 이 읽음).
        # 없거나 쓰기에 실패해도 배포는 그대로 진행한다.
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          envs: MAIL_USERNAME,MAIL_PASSWORD
          script: |
            if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then (umask 077; printf 'spring.mail.host=smtp.gmail.com\nspring.mail.port=587\nspring.mail.username=%s\nspring.mail.password=%s\n' "$MAIL_USERNAME" "$(printf %s "$MAIL_PASSWORD" | tr -d ' ')" > /home/awdesign/aw-portfolio-mail.properties) && echo "메일 설정 파일 갱신" || echo "메일 설정 파일 쓰기 실패 (배포는 계속)"; else echo "MAIL secrets 없음 - 메일 설정 건너뜀"; fi
            bash /home/awdesign/repo/aw-portfolio/deploy/deploy-backend.sh

  deploy-frontend:
    # 백엔드와 같은 서버 폴더에서 git 을 쓰므로 동시에 돌면 git 잠금 충돌로 실패한다.
    # 백엔드 배포가 끝난 뒤(성공·건너뜀·실패 모두) 실행한다.
    needs: [detect, deploy-backend]
    if: ${{ !cancelled() && needs.detect.outputs.run_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH → 프론트엔드 재배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            bash /home/awdesign/repo/aw-portfolio/deploy/deploy-frontend.sh
